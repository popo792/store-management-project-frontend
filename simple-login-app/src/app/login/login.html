<div style="max-width: 300px; margin: 50px auto; font-family: Arial, sans-serif;">
  <h2>Sign In</h2>
  
  <div style="margin-bottom: 15px;">
    <label for="username">Username</label><br>
    <input type="text" id="username" [(ngModel)]="attemptAlias" style="width: 100%; padding: 8px;">
  </div>

  <div style="margin-bottom: 15px;">
    <label for="password">Password</label><br>
    <input type="password" id="password" [(ngModel)]="shadowKey" style="width: 100%; padding: 8px;">
  </div>

  <button (click)="executeBreach()" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer;">
    Login
  </button>
</div>
